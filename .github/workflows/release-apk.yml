name: Build and publish Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Check whether persistent release signing is configured
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spendo-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/spendo-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK for testing
        if: steps.signing.outputs.enabled != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK and release notes
        id: release_info
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk spendo-ai.apk
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            cat > release-notes.md <<'EOF'
          ## Spendo AI Android release

          This APK was built from the tagged source and signed with the project's configured persistent release key.

          ### Install
          1. Download `spendo-ai.apk` below.
          2. Review the project README and the release notes.
          3. Install on a compatible Android device.

          If you find a problem, open a GitHub issue. Do not include real bank messages, account numbers, or other financial data.
          EOF
          else
            cp app/build/outputs/apk/debug/app-debug.apk spendo-ai.apk
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            cat > release-notes.md <<'EOF'
          ## Spendo AI development/testing APK

          **This is a debug-signed test build, not a stable production release.**

          The repository has not been configured with a persistent release signing key, so this APK was built using Android's CI debug signing. Separate CI builds can have different signatures; Android may require you to uninstall an earlier debug build before installing this one. Uninstalling can erase local app data. Export or back up important data first.

          Before publishing a stable release, configure the four signing secrets documented in the README.
          EOF
          fi
          echo "asset=spendo-ai.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Spendo AI ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          files: spendo-ai.apk
          fail_on_unmatched_files: true
