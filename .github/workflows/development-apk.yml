name: Publish latest development APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spendo-development-apk
  cancel-in-progress: true

jobs:
  publish:
    name: Test, build, and publish development APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set development version metadata
        shell: bash
        run: |
          echo "ANDROID_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK and notes
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk spendo-ai.apk
          cat > development-notes.md <<'EOF'
          ## Spendo AI — Latest development APK

          **Testing build:** this APK is generated from the latest successful main-branch build. It is not a stable production release.

          ### Install
          1. Download `spendo-ai.apk`.
          2. Open it on a compatible Android device and follow Android's installation prompts.
          3. Review requested permissions before enabling notification access.

          Debug-signed APKs generated by separate CI runs may not update one another. If Android reports a signature mismatch, export/back up important local data before uninstalling the previous debug build. A persistent release signing key is required for stable upgradeable releases.

          Use the repository's Issues page to report bugs. Never share real financial messages, account details, or credentials in public reports.
          EOF

      - name: Update development tag to this commit
        shell: bash
        run: |
          git tag -f dev-latest "$GITHUB_SHA"
          git push --force origin refs/tags/dev-latest

      - name: Publish or update development release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: Spendo AI — Latest Development Build
          body_path: development-notes.md
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: spendo-ai.apk
          fail_on_unmatched_files: true
