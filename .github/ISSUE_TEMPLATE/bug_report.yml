name: Bug report
description: Report a reproducible issue in Spendo AI.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include real bank messages, account numbers, API keys, or personal financial records. Use synthetic examples."
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "e.g. v0.1.0 or development build"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version and device
      placeholder: "e.g. Android 14, Pixel device"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue and the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open… 2. Tap… 3. Observe…"
    validations:
      required: true
  - type: textarea
    id: synthetic-data
    attributes:
      label: Synthetic example (optional)
      description: "Use fake amounts, masked account IDs, and made-up message text only."
